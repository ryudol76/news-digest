# 섹션마다 피드를 모으고, Claude가 섹션별로 중요한 사건 top N개를 골라 묶는다.
# 섹션을 빼고 싶으면 [[sections]] 블록을 지우면 된다.
# front = true인 섹션(1면)을 먼저 편집하고, 나머지 섹션은 1면에 실린 사건을 빼고 고른다.
# 정치·세계는 논조가 한쪽으로 쏠리지 않게 진보·보수 언론을 함께 넣었다.

